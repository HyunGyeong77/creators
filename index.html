<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="넥슨 크리에이터즈 클론 사이트">
    <meta name="keywords" content="클론 사이트, 넥슨 크리에이터즈, 포트폴리오,">
    <meta name="robots" content="index nofollow">
    <meta name="author" content="BGH">
    <meta property="og:title" conten="BGH 포트폴리오">
    <meta property="og:description" content="넥슨 크리에이터즈 클론 사이트">
    <meta name="twitter:title" content="BGH 포트폴리오">
    <meta name="twitter:description" content="넥슨 크리에이터즈 클론 사이트">
    <title>Nexon Creators</title>
    <base href="/creators/" />

    <link rel="stylesheet" href="https://unpkg.com/swiper@8.0.7/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header id="header">
        <div class="container">
            <div class="layout">
                <div class="content-wrap">
                    <a href="#">
                        <img src="assets/images/creators-campaign-logo.png" alt="로고 이미지" />
                    </a>
                    <ul>
                        <li><a href="#">홈</a></li>
                        <li><a href="#">넥슨 크리에이터즈란?</a></li>
                        <li><a href="#">크리에이터즈</a></li>
                        <li><a href="#">캠페인</a></li>
                        <li><a href="#">크리에이터즈 센터</a></li>
                    </ul>
                    <div>
                        <button href="#">
                            <svg role="img" width="16" height="16" class="text-inherit flex-none transition-all translate-y-px transition-none" data-sentry-element="svg" data-sentry-component="CustomIcon" data-sentry-source-file="index.tsx"><use href="assets/icons/sprite-5CcQ9esa.svg#user"></use></svg>
                            <span>MY 스튜디오</span>
                        </button>
                        <a href="#">로그인</a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section id="hero">
            <div class="container">
                <div class="layout">
                    <div class="content-wrap">
                        <video autoplay loop aria-label="전체 넥슨 크리에이터즈 비디오">
                            <source src="assets/videos/mainvisual.mp4" />
                        </video>
                        <div>
                            <div>
                                <p>
                                    <svg role="img" width="20" height="20" class="text-inherit flex-none transition-all translate-y-px transition-none" data-sentry-element="svg" data-sentry-component="CustomIcon" data-sentry-source-file="index.tsx"><use href="assets/icons/sprite-5CcQ9esa.svg#user"></use></svg>
                                    <strong>전체 넥슨 크리에이터즈</strong>
                                </p>
                                <p>
                                    <strong id="hero-count"></strong>
                                    <span>명</span>
                                </p>
                            </div>
                            <p>
                               <span id="hero-date"></span>
                               <span>기준</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section id="banner">
            <div class="swiper-container">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <a href="#">
                            <img src="assets/images/banner-hit2.png" alt="히트2 크리에이터즈 에셋 키트 지급 안내" width="1200" height="420" />
                        </a>
                    </div>
                    <div class="swiper-slide">
                        <a href="#">
                            <img src="assets/images/banner-creators.png" alt="크리에이터즈 신청하러 가기" width="1200" height="420" />
                        </a>
                    </div>
                    <div class="swiper-slide">
                        <a href="#">
                            <img src="assets/images/banner-hit2-2.png" alt="히트2 넥슨 크리에이터즈 확률형 콘텐츠 표기 안내" width="1200" height="420" />
                        </a>
                    </div>
                    <div class="swiper-slide">
                        <a href="#">
                            <img src="assets/images/banner-creators-2.png" alt="peak 크리에이터에 지원하세요" width="1200" height="420" />
                        </a>
                    </div>
                    <div class="swiper-slide">
                        <a href="#">
                            <img src="assets/images/banner-thefirst.png" alt="퍼스트 디센던트 크리에이터즈 신청 안내" width="1200" height="420" />
                        </a>
                    </div>
                </div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </section>
    </main>
    <footer>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="https://unpkg.com/swiper@8.0.7/swiper-bundle.min.js"></script>
    <script type="module" src="js/script.js"></script>
</body>
</html>
